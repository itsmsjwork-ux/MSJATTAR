<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">MSJ Attar Logo</title>
  <desc id="desc">Gold MSJ Attar logo with traditional dome ornament on black background.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#2a2112"/>
      <stop offset="58%" stop-color="#080604"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="gold" x1="8%" y1="10%" x2="92%" y2="88%">
      <stop offset="0%" stop-color="#7b4b13"/>
      <stop offset="24%" stop-color="#f9df91"/>
      <stop offset="48%" stop-color="#c9902f"/>
      <stop offset="72%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#8a5719"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.95 0 1 0 0 0.68 0 0 1 0 0.22 0 0 0 0.55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="244" r="180" fill="none" stroke="url(#gold)" stroke-width="8" opacity=".92"/>
  <path d="M97 245c28-83 82-126 159-126s131 43 159 126" fill="none" stroke="url(#gold)" stroke-width="4" opacity=".7"/>
  <path fill="url(#gold)" filter="url(#glow)" d="M256 42l16 38-16 28-16-28 16-38zm-57 163c0-43 17-76 57-100 40 24 57 57 57 100h-16c-4-31-18-55-41-72-23 17-37 41-41 72h-16zm-20 11h154v22H179v-22zm18 31h118v18H197v-18z"/>
  <path fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" d="M222 209c4-44 15-78 34-102m34 102c-4-44-15-78-34-102m0 0v102"/>
  <text x="256" y="336" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="142" font-weight="700" fill="url(#gold)" filter="url(#glow)">MSJ</text>
  <text x="256" y="404" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="13" fill="url(#gold)">ATTAR</text>
